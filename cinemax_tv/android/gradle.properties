org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.overridePathCheck=true
# The project is accessed through an ASCII-only subst drive on Windows because
# aapt cannot read the accented workspace path. Incremental Kotlin caches keep
# absolute paths and otherwise conflict between the real and subst drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
