name: cinemax
description: "CineMax - Filmes e Séries com Sistema de Plugins"
publish_to: 'none'
version: 1.0.20+22

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.8.1

  # DI
  get_it: ^8.0.2

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.4

  # Accounts and cloud favorites
  supabase_flutter: ^2.18.0

  # UI/UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  smooth_page_indicator: ^1.2.0+3
  iconsax: ^0.0.8

  # Video Player
  chewie: ^1.8.5
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  embed_media_observer:
    path: packages/embed_media_observer
  webview_flutter_wkwebview: ^3.16.0

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  html: ^0.15.5

  # Auto Update
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/player/
