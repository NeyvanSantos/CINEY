name: CineMax - Publicar Release & APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da Versão (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Título da Release'
        required: false
        default: 'Nova Atualização do CineMax'
      release_notes:
        description: 'Notas da Versão (Changelog)'
        required: false
        default: 'Melhorias de estabilidade, novas fontes e correções.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK e Lançar Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependências do Flutter
        working-directory: cinemax
        run: flutter pub get

      - name: 🔐 Configurar assinatura do APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          required = (
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
              "ANDROID_STORE_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Secrets de assinatura ausentes: " + ", ".join(missing))

          keystore = Path(os.environ["RUNNER_TEMP"]) / "cinemax-release-key.jks"
          keystore.write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          )
          keystore.chmod(0o600)
          properties = {
              "storeFile": str(keystore),
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
          }
          # Java Properties lê escapes Unicode e ignora espaços iniciais sem escape.
          def escape(value):
              return json.dumps(value, ensure_ascii=True)[1:-1].replace(" ", "\\ ")

          config = Path("cinemax/android/key.properties")
          config.write_text(
              "".join(f"{name}={escape(value)}\n" for name, value in properties.items()),
              encoding="ascii",
          )
          config.chmod(0o600)
          PY

      - name: 🔨 Compilar APK de Release (CineMax)
        working-directory: cinemax
        run: flutter build apk --release

      - name: 🏷️ Determinar Tag e Título
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "title=CineMax ${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "notes=Atualização automática lançada via Git Tag." >> $GITHUB_OUTPUT
          fi

      - name: 📋 Renomear APK para Distribuição
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cp cinemax/build/app/outputs/flutter-apk/app-release.apk "CiNey-${TAG}.apk"

      - name: 🚀 Criar Release no GitHub e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body: ${{ steps.vars.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            CiNey-${{ steps.vars.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
