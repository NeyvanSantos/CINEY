name: CiNey - Publicar Release & APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da Versão (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Título da Release'
        required: false
        default: 'Nova Atualização do CiNey'
      release_notes:
        description: 'Notas da Versão (Changelog)'
        required: false
        default: 'Melhorias de estabilidade, novas fontes e correções.'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.version_tag || github.ref }}
  build-and-release:
    needs: validate
    name: Compilar APK e Lançar Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0

      - name: 🏷️ Determinar Tag e Título
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_TAG: ${{ inputs.version_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$VERSION_TAG"
            TITLE="$RELEASE_TITLE"
            NOTES="$RELEASE_NOTES"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="CiNey ${TAG}"
            NOTES="Atualização automática lançada via Git Tag."
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Tag invalida; use vX.Y.Z.' >&2
            exit 1
          fi
          TITLE="$(printf '%s' "$TITLE" | tr -d '\r\n')"
          printf 'tag=%s\ntitle=%s\n' "$TAG" "$TITLE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔐 Configurar assinatura do APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          required = (
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
              "ANDROID_STORE_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Secrets de assinatura ausentes: " + ", ".join(missing))

          keystore = Path(os.environ["RUNNER_TEMP"]) / "cinemax-release-key.jks"
          keystore.write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          )
          keystore.chmod(0o600)
          properties = {
              "storeFile": str(keystore),
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
          }
          # Java Properties lê escapes Unicode e ignora espaços iniciais sem escape.
          def escape(value):
              return json.dumps(value, ensure_ascii=True)[1:-1].replace(" ", "\\ ")

          config = Path("cinemax/android/key.properties")
          config.write_text(
              "".join(f"{name}={escape(value)}\n" for name, value in properties.items()),
              encoding="ascii",
          )
          config.chmod(0o600)
          PY
          # Detecta a senha incorreta antes de instalar dependencias e compilar.
          keytool -list -keystore "$RUNNER_TEMP/cinemax-release-key.jks" \
            -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: ♻️ Cache Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: 💙 Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.41.6'
          cache: true

      - name: 📦 Instalar Dependências do Flutter
        working-directory: cinemax
        run: flutter pub get

      - name: 🔨 Compilar APK de Release (CineMax)
        working-directory: cinemax
        run: flutter build apk --release

      - name: Verificar certificado do APK
        env:
          # Obtenha o valor rodando apksigner verify --print-certs em um APK
          # ja publicado que funciona; use o certificate SHA-256 digest.
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'ANDROID_CERT_SHA256 ausente ou invalido nas variaveis do repositorio.' >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo 'apksigner nao encontrado no Android SDK.' >&2
            exit 1
          fi
          CERTS="$("$APKSIGNER" verify --print-certs cinemax/build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$CERTS"
          ACTUAL="$(printf '%s\n' "$CERTS" | sed -nE 's/^(Signer.*|V[0-9.]+ Signer.*) certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':\r' | sort -u)"
          if [[ ! "$ACTUAL" =~ ^[0-9a-f]{64}$ || "$ACTUAL" != "$EXPECTED" ]]; then
            echo 'Certificado do APK diverge de ANDROID_CERT_SHA256.' >&2
            exit 1
          fi

      - name: 📋 Renomear APK para Distribuição
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          cp cinemax/build/app/outputs/flutter-apk/app-release.apk "CiNey-${TAG}.apk"
          sha256sum "CiNey-${TAG}.apk" > "CiNey-${TAG}.apk.sha256"

      - name: 🚀 Criar Release no GitHub e Anexar APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
          files: |
            CiNey-${{ steps.vars.outputs.tag }}.apk
            CiNey-${{ steps.vars.outputs.tag }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remover arquivos de assinatura
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/cinemax-release-key.jks" cinemax/android/key.properties
