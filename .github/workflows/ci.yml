name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
    outputs:
      source_sha:
        value: ${{ jobs.verify.outputs.source_sha }}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Flutter dependencies
        working-directory: cinemax
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: cinemax
        run: flutter analyze

      - name: Install TV dependencies
        working-directory: cinemax_tv
        run: flutter pub get

      - name: Analyze Android TV code
        working-directory: cinemax_tv
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: cinemax
        run: flutter test --no-pub

      - name: Run embed JavaScript tests
        working-directory: cinemax
        run: node --test test/embed_bridge_test.cjs test/embed_media_observer_test.cjs test/embed_startup_test.cjs test/tv_hls_observer_test.cjs test/tv_remote_navigation_test.cjs test/tv_browser_transport_test.cjs

      - name: Run notification server tests
        run: node --test supabase/tests/notification_policy.test.ts

      - name: Validate shared Flutter core
        working-directory: packages/ciney_core
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test TV host
        working-directory: cinemax_tv
        run: flutter test --no-pub

      - name: Validate player engine
        working-directory: player_engine
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run test:integration

      - name: Test native CastLite
        working-directory: cinemax/android
        run: bash gradlew :castlite_engine:testDebugUnitTest

      - name: Test native TV
        working-directory: cinemax_tv/android
        run: bash gradlew :app:testDebugUnitTest
