<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recupere sua senha</title>
  </head>
  <body style="margin:0;padding:40px 20px;background:linear-gradient(135deg,#090b14 0%,#101827 100%);font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
    <div style="max-width:560px;margin:0 auto;background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,0.35);">
      <div style="padding:28px 28px 14px 28px;background:rgba(255,255,255,0.02);">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#ffb14a,#ff7a00);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(255,122,0,0.35);">
            <div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #111827;margin-left:4px;"></div>
          </div>
          <div style="font-size:28px;font-weight:700;letter-spacing:0.5px;color:#ff9500;">CINEY - Filmes e Séries ©</div>
        </div>
      </div>

      <div style="padding:0 28px 28px 28px;">
        <h2 style="margin:0 0 16px 0;font-size:28px;line-height:1.3;color:#f8fafc;">Recupere sua senha</h2>

        <p style="margin:0 0 22px 0;font-size:16px;line-height:1.6;color:#dfe7f2;">
          Digite este código no aplicativo para redefinir sua senha:
        </p>

        <div style="margin:0 auto 18px auto;padding:22px 18px;border-radius:14px;background:rgba(255,149,0,0.08);border:1px solid rgba(255,149,0,0.28);text-align:center;">
          <div style="font-size:34px;font-weight:700;letter-spacing:8px;color:#ffb14a;">{{ .Token }}</div>
        </div>

        <p style="margin:0 0 10px 0;font-size:14px;line-height:1.7;color:#c9d5e8;">
          O código é de uso único e expira em breve.
        </p>
        <p style="margin:0;font-size:14px;line-height:1.7;color:#a8b4c8;">
          Se você não pediu esta alteração, pode ignorar este e-mail e sua senha continuará igual.
        </p>
      </div>
    </div>
  </body>
</html>
